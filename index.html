<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>nuod</title>
    <link rel="preconnect" href="https://iptv-org.github.io" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css?v=mobile-watch-toolbar" />
  </head>
  <body class="browse-mode">
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-mark"></div>
      <p id="loadingMessage">Loading channel catalog...</p>
    </div>
    <div class="app-shell">
      <main class="layout">
        <section class="watch-area" aria-label="Live video">
          <div class="watch-toolbar">
            <button class="close-watch" id="closeWatch" type="button" aria-label="Return to browse"><span class="watch-back-arrow" aria-hidden="true">‹</span><span class="watch-back-label">Browse</span></button>
          </div>
          <div class="player-wrap">
            <video id="video" controls playsinline></video>
            <div class="player-empty" id="playerEmpty"><div class="play-icon">▶</div><p>Choose a channel to start watching</p></div>
          </div>
        </section>
        <aside class="browser-panel" aria-label="Channel list">
          <div class="filters">
            <div class="country-field">
              <label for="countryFilter">Country</label>
              <div class="country-combobox">
                <input id="countryFilter" value="Philippines" role="combobox" aria-autocomplete="list" aria-controls="countryOptions" aria-expanded="false" autocomplete="off" spellcheck="false" />
                <button id="countryToggle" type="button" aria-label="Show countries" tabindex="-1"></button>
                <ul id="countryOptions" class="country-options" role="listbox" hidden></ul>
              </div>
            </div>
            <div class="search-field">
              <label for="channelSearch">Search</label>
              <input id="channelSearch" type="search" placeholder="Channel name" autocomplete="off" spellcheck="false" />
            </div>
          </div>
          <div id="status" class="status">Loading channels…</div>
          <div id="channelList" class="channel-list" aria-live="polite"></div>
          <div id="scanStatus" class="scan-status" role="status" aria-live="polite" hidden></div>
        </aside>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.0/dist/hls.min.js"></script>
    <script src="app.js?v=field-cleanup"></script>
  </body>
</html>
