<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>nuod</title>
    <link rel="preconnect" href="https://iptv-org.github.io" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css?v=monochrome" />
  </head>
  <body class="browse-mode">
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
      <div class="loading-mark"></div>
      <p id="loadingMessage">Scanning available channels…</p>
    </div>
    <div class="app-shell">
      <main class="layout">
        <section class="watch-area" aria-label="Live video">
          <div class="player-wrap">
            <video id="video" controls playsinline></video>
            <div class="player-empty" id="playerEmpty"><div class="play-icon">▶</div><p>Choose a channel to start watching</p></div>
          </div>
        </section>
        <aside class="browser-panel" aria-label="Channel list">
          <div class="filters">
            <div class="country-field">
              <label for="countryFilter">Country</label>
              <div class="country-combobox">
                <input id="countryFilter" value="Philippines" role="combobox" aria-autocomplete="list" aria-controls="countryOptions" aria-expanded="false" autocomplete="off" spellcheck="false" />
                <button id="countryToggle" type="button" aria-label="Show countries" tabindex="-1"></button>
                <ul id="countryOptions" class="country-options" role="listbox" hidden></ul>
              </div>
            </div>
          </div>
          <div id="status" class="status">Loading channels…</div>
          <div id="channelList" class="channel-list" aria-live="polite"></div>
        </aside>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Primary navigation">
      <button class="mobile-nav-item" id="watchNav" type="button"><span>▣</span>Watch</button>
      <button class="mobile-nav-item active" id="browseNav" type="button"><span>⌕</span>Browse</button>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.0/dist/hls.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
